<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(to right, #ffcc70, #ff8177); height: 100vh; }
        .login-card {
            max-width: 400px; margin: auto; margin-top: 8%; padding: 30px;
            border-radius: 15px; background: white; box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .logo { font-size: 40px; }
        .btn-custom { background-color: #ff6f61; color: white; font-weight: bold; }
        .btn-custom:hover { background-color: #e65c50; }
    </style>
</head>
<body>

<div class="login-card text-center">
    <div class="logo">🛕</div>
    <h4 class="mb-3">Temple Admin Login</h4>

    {% if error %}
    <div class="alert alert-danger py-2" style="font-size:14px;">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="text" name="username" class="form-control mb-3" placeholder="Username" required>
        <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
        <button type="submit" class="btn btn-custom w-100">Login</button>
    </form>

    <p class="mt-3 text-muted" style="font-size: 12px;">Secure Access Only</p>
    <a href="/register">New temple? Register here</a>
</div>

</body>
</html>
