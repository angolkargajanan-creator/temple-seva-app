<!DOCTYPE html>
<html>
<head>
    <title>QR Code</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; text-align: center; }
        .card { margin-top: 50px; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        img { width: 250px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>📲 Temple Donation QR</h2>
        <p>Devotees scan this to open the seva booking page</p>

        <img src="/{{ qr_image }}?t={{ cache_bust }}" alt="QR Code">

        <p class="mt-3 text-muted" style="word-break: break-all;">{{ donation_url }}</p>

        <a href="/dashboard" class="btn btn-secondary mt-2">Back to Dashboard</a>
    </div>
</div>

</body>
</html>
